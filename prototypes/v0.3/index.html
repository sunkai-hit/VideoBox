function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${svgIcons[name]||svgIcons.box}</svg>`}
function uid(p='ID'){return p+Math.random().toString(36).slice(2,7).toUpperCase()}
function now(){return new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','-')}
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function badge(text,kind){const c=kind||(/已完成|已发布|在线|正常|通过|运行中|已同步|已处理/.test(text)?'green':/离线|异常|失败|未处理/.test(text)?'red':/待|训练中|转换中|处理中|缓存中/.test(text)?'orange':'blue');return `<span class="badge badge-${c}"><i></i>${esc(text)}</span>`}
function btn(label,action,opts={}){return `<button type="button" class="btn ${opts.primary?'btn-primary':''} ${opts.danger?'btn-danger':''} ${opts.ghost?'btn-ghost':''} ${opts.small?'btn-small':''}" data-action="${action}" ${opts.id?`data-id="${esc(opts.id)}"`:''} ${opts.extra||''}>${opts.icon?icon(opts.icon,15):''}${esc(label)}</button>`}
function stat(label,value,sub,ico,color='blue'){return `<div class="stat"><div class="stat-icon ${color}">${icon(ico,21)}</div><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div></div>`}
function panel(title,inside,actions='',className=''){return `<section class="panel ${className}"><div class="panel-head"><div class="panel-title">${title}</div><div class="panel-action">${actions}</div></div><div class="panel-body">${inside}</div></section>`}
function empty(title='暂无数据',subtitle='可通过上方操作创建演示数据'){return `<div class="empty">${icon('database',34)}<strong>${title}</strong><span>${subtitle}</span></div>`}
function td(body){return `<td>${body}</td>`}
function table(head,rows){return `<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${head.length}" style="text-align:center;padding:35px;color:#8c97a7">暂无符合条件的数据</td></tr>`}</tbody></table></div>`}
function fRow(label,control,hint=''){return `<div class="form-row"><label>${label}</label>${control}${hint?`<small>${hint}</small>`:''}</div>`}
function input(name,value='',type='text',placeholder=''){return `<input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${type==='number'?'step="any"':''}/>`}
function options(items,selected){return items.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(l)}</option>`}).join('')}
function select(name,items,selected){return `<select name="${name}">${options(items,selected)}</select>`}
function sectionNote(text){return `<p class="section-note">${text}</p>`}
function chart(data,color='#2876f6'){let max=Math.max(...data,10),width=420,height=132;let pts=data.map((n,i)=>`${24+i*(width-48)/(data.length-1)},${height-18-n/max*(height-38)}`);let path=pts.join(' '),last=pts[pts.length-1];return `<svg viewBox="0 0 ${width} ${height}" class="linechart" preserveAspectRatio="none"><defs><linearGradient id="fillGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".17"/><stop offset="1" stop-color="${color}" stop-opacity=".01"/></linearGradient></defs>${[1,2,3].map(i=>`<line x1="20" y1="${i*32}" x2="400" y2="${i*32}" stroke="#ebeff4"/>`).join('')}<polygon points="24,${height-18} ${path} ${last.split(',')[0]},${height-18}" fill="url(#fillGrad)"/><polyline points="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('')}</svg>`}
function ring(pct,text,accent='#24bd8a'){return `<div class="ring" style="--pct:${pct};--ring:${accent}"><div class="ring-inner"><b>${pct}%</b><small>${text}</small></div></div>`}

function pageSubtitle(){const sub={production:{overview:'查看数据制作、训练任务和可部署制品的生产进展',datasets:'样本管理、数据集版本和质量统计',annotation:'目标框标注、AI预标注与人工审核',training:'YOLO / ReID 训练任务及指标跟踪',conversion:'PT → ONNX → RKNN，适配 RK3588 边缘推理',simulation:'量化前后性能对比及误检、漏检分析',artifacts:'统一维护模型制品版本并发布入库仓库',agent:'使用自然语言描述检测目标，模拟生成建模流水线'},center:{workbench:'融合模型生产、制品下发、设备、通道和告警的统一待办与工作入口',wall:'全屏汇聚现场通道、设备健康与告警态势（全部为演示数据）',overview:'集中查看设备、制品、告警与运行概况',warehouse:'接收模型制品，维护版本并统一分发',devices:'设备注册、心跳监控、远程重启及日志管理',channels:'配置视频接入、ROI、推理参数及设备下发',alarms:'汇聚边缘告警，支持检索、处置标记与导出',users:'多账号、角色权限与账号状态维护',audit:'记录设备配置、模型部署与用户操作'},edge:{overview:'从设备管理进入的现场运行详情与网络状态模拟',live:'IPC / GB28181 视频流接入、解码与状态查看',inference:'RKNN 检测与 ByteTrack 跟踪运行展示',events:'模拟告警生成、断网缓存及自动补报',operations:'本地设备指标、日志及中心指令执行'}};return sub[ui.sys]?.[ui.page]||''}

function simulationPage(){const rks=state.artifacts.filter(a=>a.type==='RKNN');return `${sectionNote('仿真测试用于比较量化前后的识别精度，并记录模拟的误检、漏检分析结果。')}<div class="panel-inline-bar"><div><label>选择 RKNN 制品</label>${select('simArtifact',rks.map(a=>[a.id,`${a.name} ${a.version}`]),ui.selectedModel)}</div>${btn('执行仿真测试','run-simulation',{primary:true,icon:'play'})}</div><div class="grid-6-6">${panel('量化前后精度对比',`<div class="compare-bars">${(()=>{let a=artifact(ui.selectedModel)||rks[0];let before=state.artifacts.find(p=>p.id===a?.sourceId)?.accuracy||94.0, after=a?.accuracy||92.8;return `<div class="compare-label"><span>原始 PT 模型</span><b>${before}%</b></div><div class="big-progress"><i style="width:${before}%;background:#3f80f8"></i></div><div class="compare-label"><span>RKNN 量化模型</span><b>${after}%</b></div><div class="big-progress"><i style="width:${after}%;background:#22b89a"></i></div><div class="compare-insight">模拟精度变化 <b>${(after-before).toFixed(1)}%</b> · 运行平台 RK3588</div>`})()}</div>`)}${panel('仿真报告',`<div class="report-list">${state.reports.length?state.reports.slice().reverse().map(r=>`<div class="report-item"><div class="r-icon">${icon('chart',20)}</div><div><b>${esc(artifact(r.artifactId)?.name||r.artifactId)} · ${esc(r.id)}</b><small>${esc(r.created)} · 漏检 ${r.miss} · 误检 ${r.false}</small></div>${badge(r.status)}</div>`).join(''):empty('尚无测试记录')}</div>`)} </div>`}

function agentPage(){const sample='请创建一个检测工厂作业人员是否佩戴安全帽的模型，适用于车间入口摄像头，目标设备为 RK3588。';return `<div class="agent-layout">${panel('自然语言建模助手',`<div class="chat-intro"><div class="chat-icon">${icon('bot',28)}</div><div><h3>描述业务场景，生成模型生产计划</h3><p>自动提取检测目标和部署要求，推荐数据集、训练类型与量化配置（演示规则解析）。</p></div></div><textarea id="agentPrompt" class="agent-textarea" placeholder="请描述您的识别场景，例如：${sample}">${esc(ui.agentText||sample)}</textarea><div class="inline-actions" style="margin-top:12px">${btn('解析需求并生成方案','parse-agent',{primary:true,icon:'bot'})}${btn('填入烟火场景示例','smoke-agent',{icon:'edit'})}</div><div class="agent-disclaimer">${icon('warning',16)} 此处为规则驱动的原型模拟，并非调用实际大语言模型。</div>`)}${panel('建议与执行进度',ui.agentPlan?`<div class="agent-plan"><div class="plan-kpis"><div><small>检测目标</small><strong>${esc(ui.agentPlan.target)}</strong></div><div><small>训练类型</small><strong>YOLO 目标检测</strong></div><div><small>量化方案</small><strong>RK3588 / INT8</strong></div></div><div class="plan-steps">${['生成数据集','创建训练任务','产出 PT 模型','转换 RKNN','仿真评估','发布入库'].map((t,i)=>`<div class="plan-step ${i<ui.agentStep?'passed':i===ui.agentStep?'now':''}"><i>${i<ui.agentStep?icon('check',12):i+1}</i>${t}</div>`).join('')}</div><div class="inline-actions">${btn(ui.agentStep>=6?'已完成生产任务':'一键模拟执行生产任务','execute-agent',{primary:true,icon:'play',extra:ui.agentStep>=6?'disabled':''})}</div></div>`:empty('等待业务场景输入','输入自然语言后生成可执行的演示生产计划'))}</div>`}
function centerWorkbench(){
 const online=state.devices.filter(d=>d.online).length,offline=state.devices.filter(d=>!d.online),pending=pendingAlarms(),buffered=bufferedAlarms();
 const noModel=allChannels().filter(({channel:c})=>!c.modelId);
 const tasks=[
 {num:pending.length,name:'待标记告警',desc:'查看告警抓拍并完成处置标记',page:'alarms',kind:'warn'},
 {num:offline.length,name:'离线设备',desc:'定位断网设备和状态',page:'devices',kind:'warn'},
 {num:buffered.length,name:'等待上报',desc:'边缘离线缓存告警',page:'devices',kind:'notice'},
 {num:noModel.length,name:'未关联算法的通道',desc:'补齐通道的算法配置',page:'channels',kind:'notice'}
 ];
 return `<div class="workbench-welcome"><div class="wb-welcome-text"><span class="wb-kicker">CONTROL CENTER / DAILY OPERATIONS</span><h2>AI视频智能分析 · 综合工作台</h2><p>统一查看模型生产、制品发布、设备运行、通道配置和告警待办；所有数据在同一产品内联动。</p><div class="wb-actions">${btn('进入通道配置','navigate',{primary:true,icon:'camera',extra:'data-page="channels"'})}${btn('打开监控大屏','navigate',{icon:'eye',extra:'data-page="wall"'})}</div></div><div class="wb-status"><span class="wb-status-label">今日值守概况</span><strong>${online}<small>/${state.devices.length} 台在线</small></strong><span>当前有 ${pending.length} 条待处理告警</span></div></div>
 <div class="stats-grid four">${stat('纳管设备',state.devices.length,`${offline.length} 台离线`,'server','blue')}${stat('视频通道',allChannels().length,`${allChannels().filter(x=>x.device.online&&x.channel.running).length} 路可用`,'camera','teal')}${stat('制品仓库',state.artifacts.filter(a=>a.type==='RKNN'&&a.published).length,'中心已接收的 RKNN 制品','box','purple')}${stat('未处理告警',pending.length,`${buffered.length} 条在边缘待补报`,'bell','orange')}</div>
 <div class="grid-7-5">${panel('待办与异常关注',`<div class="wb-task-list">${tasks.map(t=>`<button class="wb-task" data-action="navigate" data-page="${t.page}"><span class="wb-task-num ${t.num?'warn':''}">${t.num}</span><span class="wb-task-main"><strong>${t.name}</strong><small>${t.desc}</small></span>${icon('arrow',17)}</button>`).join('')}</div>`,btn('设备监测','navigate',{extra:'data-page="devices"',small:true}))}
 ${panel('常用工作入口',`<div class="shortcuts">${shortcut('制品仓库','接收、查看、下发模型制品','navigate','warehouse','box','purple')}${shortcut('通道与算法配置','集中查看与修改各设备通道','navigate','channels','camera','blue')}${shortcut('告警数据管理','查看抓拍与告警状态','navigate','alarms','bell','orange')}${shortcut('设备管理','运行监测与远程运维','navigate','devices','server','teal')}</div>`)}</div>
 <div class="grid-7-5">${panel('模型生产与制品联动',`<div class="wb-flow"><div><strong>${state.training.filter(x=>x.status==='已完成').length}</strong><small>训练已完成</small></div><span>→</span><div><strong>${state.artifacts.filter(a=>a.type==='RKNN').length}</strong><small>RKNN制品</small></div><span>→</span><div><strong>${state.artifacts.filter(a=>a.type==='RKNN'&&a.published).length}</strong><small>中心已发布</small></div><span>→</span><div><strong>${state.devices.filter(d=>d.modelId).length}</strong><small>已接收制品的设备</small></div></div><p class="muted">模型生产完成后发布到制品仓库，再选择边缘设备进行下发。</p>`,btn('进入模型生产','route',{extra:'data-sys="production" data-page="overview"',small:true,icon:'arrow'}))}${panel('最近下发与配置',`<div class="wb-log-list">${[...state.deployments.map(x=>({time:x.time,action:'模型制品下发',detail:`${dev(x.deviceId)?.name||x.deviceId} · ${artifact(x.modelId)?.version||''}`})),...state.deliveries.map(x=>({time:x.time,action:'通道参数下发',detail:`${dev(x.deviceId)?.name||x.deviceId} / ${x.channelId}`}))].sort((a,b)=>b.time.localeCompare(a.time)).slice(0,5).map(x=>`<div><span class="wb-log-mark"></span><span><b>${esc(x.action)}</b><small>${esc(x.detail)}</small></span><time>${esc(x.time)}</time></div>`).join('')||'<div class="muted">暂无下发记录，可从制品仓库或通道配置页模拟操作。</div>'}</div>`,btn('通道配置','navigate',{extra:'data-page="channels"',small:true}))}</div>
 <div class="grid-7-5">${panel('最近告警',table(['发生时间','设备／视频通道','告警类型','状态','操作'],state.alarms.filter(a=>a.synced).slice(0,5).map(a=>`<tr>${td(esc(a.time))}${td(`<b>${esc(dev(a.deviceId)?.name||'')}</b><small>${esc(channelName(a))}</small>`)}${td(esc(a.type))}${td(badge(a.status))}${td(btn('查看','alarm-detail',{id:a.id,small:true}))}</tr>`)),btn('全部告警','navigate',{extra:'data-page="alarms"',small:true}))}
 ${panel('最近管理操作',`<div class="wb-log-list">${state.audit.slice(0,7).map(x=>`<div><span class="wb-log-mark"></span><span><b>${esc(x.action)}</b><small>${esc(x.detail)}</small></span><time>${esc(x.time)}</time></div>`).join('')}</div>`,btn('操作审计','navigate',{extra:'data-page="audit"',small:true}))}</div>`;
}
function wallShell(content){return `<div class="wall-root"><div class="wall-header"><div class="wall-brand"><span class="wall-mark">AI</span><div><h1>AI视频智能分析 · 监控大屏</h1><small>统一管理平台 / 综合运行态势 · 演示数据</small></div></div><div class="wall-header-right"><time>${esc(now())}</time>${btn('刷新数据','wall-refresh',{ghost:true,icon:'refresh'})}${btn('全屏切换','toggle-wall-fullscreen',{ghost:true,icon:'eye'})}${btn('返回工作台','wall-back',{ghost:true,icon:'back'})}</div></div>${content}<div class="wall-footnote">数据来源：本地原型模拟数据；视频画面为场景示意，非实际摄像头直播。</div>${ui.toast?`<div class="toast ${ui.toast.type}">${esc(ui.toast.msg)}</div>`:''}</div>`}
function centerWall(){const online=state.devices.filter(d=>d.online).length;const chs=allChannels(),active=chs.filter(x=>x.device.online&&x.channel.running);const arr=state.alarms.filter(a=>a.synced);let cnt={};arr.forEach(a=>cnt[a.type]=(cnt[a.type]||0)+1);let group=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
const videoCards=active.slice(0,4).map(({device:d,channel:c})=>`<div class="wall-video wall-clickable" data-action="wall-open-channel" data-device="${esc(d.id)}" data-channel="${esc(c.id)}" title="点击查看通道配置"><img src="${c.image}"/><div class="wall-video-top"><span>${esc(d.site)} · ${esc(c.name)}</span><span class="wall-video-live">● 演示画面</span></div><div class="wall-video-bot">${icon('camera',14)} ${esc(c.protocol)} / ${esc(c.codec)}　 ${esc(modelForChannel(c,d)?.name||'未配置算法')}</div></div>`).join('');
const offlineTiles=chs.filter(({device:d,channel:c})=>!d.online||!c.running).slice(0,Math.max(0,4-active.length)).map(({device:d,channel:c})=>`<div class="wall-video wall-video-offline"><div class="wall-offline-body">${icon('wifi',34)}<strong>视频源离线</strong><span>${esc(d.site)} · ${esc(c.name)}</span></div></div>`).join('');
return `<div class="wall-stats"><div><small>边缘设备</small><b>${state.devices.length}</b><span>在线 ${online} / 离线 ${state.devices.length-online}</span></div><div><small>视频通道</small><b>${chs.length}</b><span>当前可用 ${active.length} 路</span></div><div><small>已发布制品</small><b>${state.artifacts.filter(a=>a.type==='RKNN'&&a.published).length}</b><span>RKNN / INT8</span></div><div><small>中心告警</small><b>${arr.length}</b><span>待处理 ${pendingAlarms().length}</span></div><div><small>边缘待补报</small><b>${bufferedAlarms().length}</b><span>断网缓存队列</span></div></div>
<div class="wall-primary"><section class="wall-panel wall-video-panel"><div class="wall-title"><strong>现场视频监看</strong><small>多路视频示意 / ${active.length} 路在线</small></div><div class="wall-videos">${(videoCards+offlineTiles)||'<p class="wall-empty">暂无可用视频通道</p>'}</div></section><section class="wall-panel"><div class="wall-title"><strong>最新告警事件</strong><small>中心已接收记录</small></div><div class="wall-alerts">${arr.slice(0,7).map(a=>`<div class="wall-alert wall-clickable" data-action="wall-open-alarm" data-id="${esc(a.id)}" title="点击查看告警详情"><span class="wall-alarm-time">${esc(a.time.slice(11))}</span><div><strong>${esc(a.type)}</strong><small>${esc(channelName(a))} · ${esc(dev(a.deviceId)?.site||'')}</small></div><em class="${a.level==='高'?'high':''}">${esc(a.level)}风险</em></div>`).join('')||'<p>暂无中心告警</p>'}</div></section></div>
<div class="wall-secondary"><section class="wall-panel"><div class="wall-title"><strong>设备运行状态</strong><small>心跳与资源快照</small></div><div class="wall-device-list">${state.devices.map(d=>`<div><span class="wall-led ${d.online?'':'off'}"></span><span>${esc(d.name)}</span><span>${esc(d.cpu)}% CPU</span><b>${d.online?'在线':'离线'}</b></div>`).join('')}</div></section><section class="wall-panel"><div class="wall-title"><strong>告警类型分布</strong><small>按已上报告警计算</small></div><div class="wall-bars">${group.length?group.slice(0,5).map(([name,n])=>`<div><span>${esc(name)}</span><div class="wall-bar"><i style="width:${Math.round(n/Math.max(...group.map(x=>x[1]))*100)}%"></i></div><b>${n}</b></div>`).join(''):'<p>暂无数据</p>'}</div></section><section class="wall-panel"><div class="wall-title"><strong>模型部署状态</strong><small>设备制品分发概览</small></div><div class="wall-deployment">${state.devices.map(d=>`<div><span>${esc(d.name)}</span><b>${esc(artifact(d.modelId)?.version||'未部署')}</b></div>`).join('')}</div></section></div>`;
}

function centerOverview(){const on=state.devices.filter(d=>d.online).length;const alerts=state.alarms.filter(a=>a.synced);return `<div class="stats-grid four">${stat('纳管边缘设备',state.devices.length,`${on} 台在线 · ${state.devices.length-on} 台离线`,'server','blue')}${stat('制品仓库',state.artifacts.filter(a=>a.published).length,'已发布 RKNN 模型包','box','purple')}${stat('视频通道',state.devices.flatMap(d=>d.channels).length,'来自多个边缘设备','camera','teal')}${stat('中心告警',alerts.length,`${alerts.filter(a=>a.status==='未处理').length} 条待处置`,'bell','orange')}</div><div class="grid-7-5">${panel('告警趋势与统计',`<div class="chart-meta"><span class="subtitle">最近7日告警汇总（演示数据）</span>${badge('实时联动','blue')}</div>${chart([5,8,6,12,10,15,Math.max(4,alerts.length*3)],'#3d7ff8')}<div class="chart-x"><span>10/29</span><span>10/30</span><span>10/31</span><span>11/01</span><span>11/02</span><span>11/03</span><span>11/04</span></div>` ,btn('查看全部告警','navigate',{extra:'data-page="alarms"',small:true}))}${panel('设备在线概况',`<div class="health-overview">${ring(Math.round(on/state.devices.length*100),'设备在线率')}</div><div class="status-detail"><p><span class="dot good"></span>正常在线 <b>${on} 台</b></p><p><span class="dot danger"></span>当前离线 <b>${state.devices.length-on} 台</b></p><p><span class="dot warning"></span>待补报事件 <b>${state.alarms.filter(a=>!a.synced).length} 条</b></p></div>`,btn('设备管理','navigate',{extra:'data-page="devices"',small:true}))}</div><div class="grid-7-5">${panel('边缘设备列表',table(['设备','位置','当前模型','状态','操作'],state.devices.map(d=>`<tr>${td(`<b>${esc(d.name)}</b><small>${esc(d.ip)}</small>`)}${td(esc(d.site))}${td(d.modelId?esc(artifact(d.modelId)?.name||d.modelId):'未部署')}${td(badge(d.online?'在线':'离线'))}${td(btn('运行详情','open-edge',{id:d.id,small:true}))}</tr>`)),btn('全部设备','navigate',{extra:'data-page="devices"',small:true}))}${panel('最新汇聚告警',`<div class="alert-stack">${alerts.slice(0,5).map(a=>`<div class="alert-stack-row"><img src="${a.image}"/><div><b>${esc(a.type)}</b><small>${esc(channelName(a))} · ${esc(a.time) function drawerRender(){const m=ui.drawer;if(!m)return '';let title='',content='';if(m.type==='device'){let d=dev(m.id);if(!d)return '';title=d.name;content=`<div class="drawer-subtitle">${esc(d.id)} · ${esc(d.ip)} · ${badge(d.online?'在线':'离线')}</div><div class="drawer-cover">${icon('server',40)}<div><b>${esc(d.site)}</b><small>边缘计算设备 · RK3588 演示平台</small></div></div><div class="drawer-section"><h3>设备运行信息</h3><div class="detail-list">${[['设备ID',d.id],['设备IP',d.ip],['心跳状态',d.online?'正常':'已断开'],['CPU 使用率',d.cpu+'%'],['NPU 使用率',d.npu+'%'],['CPU温度',d.temp+'℃'],['内存占用',d.mem+'%'],['磁盘占用',d.disk+'%'],['运行模型',artifact(d.modelId)?.name||'未部署'],['通道数量',d.channels.length]].map(x=>`<div>${esc(x[0])}<b>${esc(x[1])}</b></div>`).join('')}</div></div><div class="drawer-section"><h3>视频通道</h3>${d.channels.map(c=>`<div class="drawer-channel">${icon('camera',17)} ${esc(c.name)} <span class="drawer-channel-model">${esc(modelForChannel(c,d)?.name||'未关联算法')}</span> ${badge(c.running?'运行中':'停止')}</div>`).join('')}</div><div class="drawer-actions">${btn('进入设备运行详情','open-edge',{id:d.id,primary:true})}${btn('通道配置','go-device-config',{id:d.id})}${btn('获取日志','fetch-logs',{id:d.id})}${btn('远程重启','reboot-device',{id:d.id})}</div>`}
 if(m.type==='alarm'){let a=state.alarms.find(x=>x.id===m.id);if(!a)return '';title='告警详情';content=`<div class="drawer-subtitle">${esc(a.id)} · ${badge(a.level==='高'?'高风险':'中风险',a.level==='高'?'red':'orange')}</div><img class="alarm-cover" src="${a.image}"/><div class="drawer-section"><h3>事件基本信息</h3><div class="detail-list">${[['告警类型',a.type],['告警编号',a.id],['告警时间',a.time],['来源设备',dev(a.deviceId)?.name||'—'],['来源通道',channelName(a)],['当前状态',a.status],['中心同步',a.synced?'已上报':'本地缓存']].map(x=>`<div>${esc(x[0])}<b>${esc(x[1])}</b></div>`).join('')}</div></div><div class="drawer-section"><h3>告警抓拍与处置</h3><p class="muted">当前图像为模拟抓拍。中心只进行告警处置标记，不延伸至应急工单和指挥调度。</p></div><div class="drawer-actions">${a.status==='未处理'?btn('标记已处理','handle-alarm',{id:a.id,primary:true}):badge('已处理')}</div>`}
 if(m.type==='training'){let t=state.training.find(x=>x.id===m.id);if(!t)return '';title=t.name;content=`<div class="drawer-subtitle">${esc(t.id)} · ${badge(t.status)}</div><div class="drawer-section"><h3>训练配置</h3><div class="detail-list">${[['框架',t.framework],['数据集',dataset(t.datasetId)?.name||'—'],['训练轮数',t.epochs],['Batch',t.batch],['学习率',t.lr],['执行进度',t.progress+'%'],['模拟精度',(t.accuracy||'—')+'%'],['模拟Loss',t.loss||'—']].map(x=>`<div>${esc(x[0])}<b>${esc(x[1])}</b></div>`).join('')}</div></div><div class="drawer-section"><h3>训练状态</h3><div class="progress large"><i style="width:${t.progress}%"></i></div><p class="muted">训练过程为模拟展示，完成后自动生成关联 PT 制品。</p></div>${t.status==='训练中'?`<div class="drawer-actions">${btn('完成模拟训练','finish-train',{id:t.id,primary:true})}</div>`:''}`}
 return `<div class="drawer-layer" data-action="close-drawer-bg"><aside class="drawer"><div class="drawer-head"><h2>${esc(title)}</h2><button class="close-x" data-action="close-drawer">×</button></div><div class="drawer-content">${content}</div></aside></div>`}
function doModalSubmit(){const m=ui.modal;if(!m)return;let form=document.getElementById('modal-form');if(!form)return;const d=Object.fromEntries(new FormData(form).entries());if(m.type==='dataset'){if(!d.name?.trim())return toast('请填写数据集名称','error');let n={id:uid('DS-'),name:d.name.trim(),classes:String(d.classes||'目标').split(/[,，]/).map(x=>x.trim()).filter(Boolean),samples:[],created:now(),version:'V1.0'};state.datasets.unshift(n);ui.chosenDataset=n.id;ui.chosenSample='';audit('创建数据集',n.name);ui.modal=null;navigate('production','datasets');toast('数据集已创建，可上传样本');return}
 if(m.type==='train'){if(!d.name?.trim())return toast('请输入任务名称','error');const t={id:uid('TR-'),name:d.name,datasetId:d.datasetId,framework:d.framework,epochs:Number(d.epochs)||100,batch:Number(d.batch)||16,lr:Number(d.lr)||.001,status:'训练中',progress:8,accuracy:0,loss:.95,created:now()};state.training.unshift(t);audit('创建训练任务',`${t.id} · ${t.name}`);ui.modal=null;navigate('production','training');toast('训练任务已创建，开始演示训练');startTrainingTick(t.id);return}
 if(m.type==='convert'){let p=artifact(d.ptId);if(!p)return toast('请先完成至少一项模型训练','error');let a={id:uid('RK-'),name:p.name,version:d.version||'V1.0.1',type:'RKNN',taskId:p.taskId,datasetId:p.datasetId,sourceId:p.id,accuracy:Math.max(60,Number((p.accuracy-.8).toFixed(1))),device:'RK3588',quant:'INT8',tested:false,published:false,created:now()};state.artifacts.push(a);ui.selectedModel=a.id;audit('模型转换量化',`${p.id} → ${a.id} / INT8`);ui.modal=null;save();navigate('production','conversion');toast(`模拟转换完成，已生成 ${a.id}`);return}
 if(m.type==='channel'){let dd=dev(d.deviceId);if(!dd)return toast('请选择边缘设备','error');if(!d.name?.trim())return toast('请输入通道名称','error');let c={id:uid('CH-'),name:d.name.trim(),protocol:d.protocol||'RTSP',codec:'H.264',url:d.url||'',modelId:null,confidence:.65,iou:.45,debounce:5,roi:{x:12,y:15,w:70,h:68},schedule:'轮询',running:true,image:CAM[dd.channels.length%CAM.length]};dd.channels.push(c);ui.selectedDevice=dd.id;ui.selectedChannel=c.id;audit('新建视频通道',`${dd.id}/${c.id}`);ui.modal=null;save();navigate('center','channels');toast('已新增演示通道，请配置并下发');return}
 if(m.type==='device'){if(!d.name?.trim())return toast('请填写设备名称','error');let v={id:uid('EDGE-'),name:d.name,site:d.site||'待指定',ip:d.ip||'0.0.0.0',online:true,cpu:19,npu:10,mem:33,disk:12,temp:43,modelId:null,downloadedModels:[],updated:'刚刚',channels:[{id:uid('CH-'),name:'默认视频通道',protocol:'RTSP',codec:'H.264',url:'rtsp://192.168.1.100/live',modelId:null,confidence:.6,iou:.45,debounce:5,roi:{x:14,y:16,w:70,h:65},schedule:'轮询',running:true,image:CAM[0]}]};state.devices.push(v);audit('设备注册',`${v.id} · ${v.name}`);ui.modal=null;navigate('center','devices');toast('演示设备注册成功');return}
 if(m.type==='user'){if(!d.name?.trim())return toast('请输入用户名','error');if(state.users.some(x=>x.name===d.name.trim()))return toast('该用户名已存在','error');state.users.push({id:uid('U-'),name:d.name,real:d.real||d.name,role:d.role,enabled:true});audit('新增用户',d.name);ui.modal=null;navigate('center','users');toast('演示账号创建成功');return}
 if(m.type==='deploy'){let target=dev(d.deviceId);let a=artifact(m.id);if(!target?.online)return toast('设备离线，无法即时下发；请先恢复网络','error');if(!a)return toast('制品不存在','error');target.modelId=a.id;if(!target.downloadedModels.includes(a.id))target.downloadedModels.push(a.id);state.deployments.unshift({time:now(),deviceId:target.id,modelId:a.id,type:'下发',status:'成功'});state.logs.unshift({time:now(),dev:target.id,msg:`中心下发 ${a.name} ${a.version} 成功`,type:'info'});audit('模型下发',`${a.id} → ${target.id}`);ui.modal=null;save();navigate('center','devices');toast('制品下发成功，可从设备管理进入设备运行详情查看');return}
 if(m.type==='rollback'){let target=dev(d.deviceId);if(!target?.online)return toast('目标设备不在线，无法即时回滚','error');const old=artifact(target.modelId);const chosen=artifact(d.modelId);target.modelId=d.modelId;if(!target.downloadedModels.includes(d.modelId))target.downloadedModels.push(d.modelId);target.channels.forEach(c=>{if(c.modelId&&artifact(c.modelId)?.name===chosen?.name)c.modelId=d.modelId;});state.deployments.unshift({time:now(),deviceId:target.id,modelId:d.modelId,type:'回滚',status:'成功'});audit('制品版本回滚',`${d.deviceId} → ${d.modelId}`);ui.modal=null;save();render();toast('已完成制品版本回滚模拟');return}}
function startTrainingTick(id){let n=0;const tmr=setInterval(()=>{const t=state.training.find(x=>x.id===id);if(!t||t.status!=='训练中'){clearInterval(tmr);return}t.progress=Math.min(94,t.progress+Math.floor(Math.random()*14+4));t.accuracy=Number((75+t.progress*.19).toFixed(1));t.loss=Number(Math.max(.09,1-t.progress/108).toFixed(3));save();if(ui.sys==='production'&&ui.page==='training'&&!ui.modal&&!ui.drawer)render();if(t.progress>=94){clearInterval(tmr);finishTraining(id,false)}},650)}
function finishTraining(id,notify=true){const t=state.training.find(x=>x.id===id);if(!t)return; t.status='已完成';t.progress=100;t.accuracy=Number((t.accuracy>85?t.accuracy:92.5).toFixed(1));t.loss=.082;let existing=state.artifacts.some(a=>a.taskId===id&&a.type==='PT');if(!existing){let a={id:uid('PT-'),name:`${t.framework==='YOLO'?'目标检测 YOLO':'特征提取 ReID'} · ${dataset(t.datasetId)?.name||'新数据集'}`,version:'V1.0.0',type:'PT',taskId:t.id,datasetId:t.datasetId,accuracy:t.accuracy,created:now(),published:false};state.artifacts.push(a)}audit('训练任务完成',id);ui.drawer=null;save();render();if(notify)toast('训练模拟完成，PT 模型已加入制品管理')}
function addAlarm(deviceId){let d=dev(deviceId);if(!d)return;let c=d.channels[Math.floor(Math.random()*d.channels.length)];let labels=['人员进入危险区域','烟雾异常','人员未佩戴安全帽','车辆进入检测区'];let type=labels[Math.floor(Math.random()*labels.length)];let a={id:uid('AL-'),deviceId:d.id,channelId:c.id,type,level:type.includes('烟雾')||type.includes('危险')?'高':'中',time:now(),status:'未处理',synced:d.online,image:c.image};state.alarms.unshift(a);state.logs.unshift({time:now(),dev:d.id,msg:`检测到 ${a.type}；${d.online?'已上报中心':'已写入本地缓存'}`,type:d.online?'info':'warn'});audit('边缘告警生成',`${d.id} · ${a.id}`,'edge-agent');save();render();toast(d.online?'模拟告警已生成并同步中心':'断网告警已写入本地缓存');}
function flushQueue(id){let d=dev(id);if(!d?.online)return 0;let al=state.alarms.filter(a=>a.deviceId===id&&!a.synced);al.forEach(a=>a.synced=true);if(al.length){state.logs.unshift({time:now(),dev:id,msg:`网络恢复，自动补报 ${al.length} 条告警与抓拍`,type:'info'});audit('离线告警补报',`${id} · ${al.length} 条`,'edge-agent');save()}return al.length}
function switchOnline(id){let d=dev(id);if(!d)return;d.online=!d.online;d.updated=d.online?'刚刚':now();state.logs.unshift({time:now(),dev:id,msg:d.online?'设备网络恢复，中心连接已建立':'网络中断，进入离线分析缓存模式',type:d.online?'info':'warn'});let n=d.online?flushQueue(id):0;audit('设备网络模拟',`${id} → ${d.online?'上线':'离线'}${n?`，补报${n}条`:''}`);save();render();toast(d.online?`设备已上线${n?`，自动补报 ${n} 条告警`:''}`:'设备已离线，继续本地分析');}
function exportCsv(){let data=state.alarms.filter(a=>a.synced&&(!ui.alarmQuery||`${a.type} ${a.id} ${channelName(a)}`.includes(ui.alarmQuery))&&(ui.alarmStatus==='全部'||a.status===ui.alarmStatus)&&(ui.alarmType==='全部'||a.type===ui.alarmType)&&(ui.alarmDevice==='全部'||a.deviceId===ui.alarmDevice)&&(!ui.alarmFrom||a.time.slice(0,10)>=ui.alarmFrom)&&(!ui.alarmTo||a.time.slice(0,10)<=ui.alarmTo));let out='编号,类型,风险等级,设备,通道,时间,状态\n'+data.map(a=>[a.id,a.type,a.level,dev(a.deviceId)?.name,channelName(a),a.time,a.status].map(x=>'"'+String(x||'').replaceAll('"','""')+'"').join(',')).join('\n');let blob=new Blob(['\ufeff'+out],{type:'text/csv;charset=utf-8'});let u=URL.createObjectURL(blob);let el=document.createElement('a');el.href=u;el.download='中心告警记录_演示.csv';el.click();setTimeout(()=>URL.revokeObjectURL(u),1000);audit('导出告警',`${data.length} 条`);toast('告警 CSV 已导出')}
function downloadSampleYOLO(){let ds=dataset(ui.chosenDataset);if(!ds)return;let sample=ds.samples.find(x=>x.id===ui.chosenSample);let text=`# YOLO Label Export - Prototype\n# Dataset: ${ds.name}\n# Sample: ${sample?.name}\n`+(sample?.boxes||[]).map(b=>{let cls=Math.max(0,ds.classes.indexOf(b.label));return `${cls} ${((b.x+b.w/2)/100).toFixed(4)} ${((b.y+b.h/2)/100).toFixed(4)} ${(b.w/100).toFixed(4)} ${(b.h/100).toFixed(4)}`}).join('\n');const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.href=u;a.download='yolo_labels_demo.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function handleClick(e){const x=e.target.closest('[data-action]');if(!x)return;let action=x.dataset.action,id=x.dataset.id;if((action==='close-modal-bg'||action==='close-drawer-bg')&&e.target!==x)return;const doNav=page=>navigate(x.dataset.sys||ui.sys,page);switch(action){
 case'switch':navigate(x.dataset.sys,x.dataset.sys==='center'?'workbench':'overview');break;
  case'route':navigate(x.dataset.sys||'center',x.dataset.page||'workbench');break;
  case'toggle-nav-group':ui.openGroups[id]=!ui.openGroups[id];render();break;

 case'navigate':doNav(x.dataset.page||'overview');break;

 case'reset-confirm':ui.modal={type:'confirm',message:'确定要清空全部演示操作并恢复预设数据吗？此操作不会影响您的本地文件。',target:'reset'};render();break;
 case'show-guide':ui.modal={type:'confirm',title:'使用说明',message:'从统一菜单依次进入：模型生产（数据集 → 标注 → 训练 → 转换量化 → 仿真）→ 制品与版本（发布）→ 制品仓库与下发 → 设备管理（运行详情）→ 模拟断网、产生告警、恢复补报 → 告警管理。全部为浏览器本地模拟数据。',target:'close'};render();break;
 case'modal-dataset':ui.modal={type:'dataset'};render();break;
 case'modal-train':ui.modal={type:'train'};render();break;
 case'modal-convert':ui.modal={type:'convert',id};render();break;
 case'modal-user':ui.modal={type:'user'};render();break;
 case'modal-device':ui.modal={type:'device'};render();break;
 case'modal-channel':ui.modal={type:'channel'};render();break;
 case'deploy-modal':ui.modal={type:'deploy',id};render();break;
 case'rollback-modal':ui.modal={type:'rollback',id};render();break;
 case'close-modal':case'close-modal-bg':ui.modal=null;render();break;
 case'confirm-action':if(ui.modal?.target==='reset'){state=defaultState();upgradeState();save();ui.modal=null;navigate('center','workbench');toast('已恢复预设演示数据')}else{ui.modal=null;render()}break;
 case'close-drawer':case'close-drawer-bg':ui.drawer=null;render();break;
 case'device-detail':ui.drawer={type:'device',id};render();break;
 case'alarm-detail':ui.drawer={type:'alarm',id};render();break;
 case'train-detail':ui.drawer={type:'training',id};render();break;
 case'open-annotation':{const ds=dataset(id);ui.chosenDataset=id;ui.chosenSample=ds.samples[0]?.id||'';navigate('production','annotation');break}
 case'pick-sample':ui.chosenSample=id;render();break;
 case'upload-sample':document.getElementById('upload-'+id)?.click();break;
 case'auto-label':{let ds=dataset(ui.chosenDataset);let sample=ds?.samples.find(s=>s.id===ui.chosenSample);if(!sample)return toast('请先选择可标注的样本','error');const lab=ds.classes[0]||'目标';sample.boxes=[{id:uid('B-'),label:lab,x:18,y:18,w:24,h:60},{id:uid('B-'),label:lab,x:52,y:22,w:19,h:54}];sample.reviewed=false;save();render();toast('已生成预标注框，请人工复核');break}
 case'add-label':{let ds=dataset(ui.chosenDataset),sample=ds?.samples.find(s=>s.id===ui.chosenSample);if(!sample)return toast('请先选择样本','error');sample.boxes.push({id:uid('B-'),label:ui.annoClass||ds.classes[0]||'目标',x:24,y:24,w:22,h:40});sample.reviewed=false;save();render();break}
 case'canvas-add-box':{if(e.target.closest('.anno-box'))break;let ds=dataset(ui.chosenDataset),sample=ds?.samples.find(s=>s.id===ui.chosenSample);if(!sample)return;let r=x.getBoundingClientRect();let xx=Math.min(75,Math.max(1,(e.clientX-r.left)/r.width*100-9)),yy=Math.min(65,Math.max(1,(e.clientY-r.top)/r.height*100-16));sample.boxes.push({id:uid('B-'),label:ui.annoClass||ds.classes[0]||'目标',x:Math.round(xx),y:Math.round(yy),w:19,h:31});sample.reviewed=false;save();render();break}
 case'delete-box':{let ds=dataset(ui.chosenDataset),sample=ds.samples.find(s=>s.id===ui.chosenSample);sample.boxes=sample.boxes.filter(b=>b.id!==id);sample.reviewed=false;save();render();break}
 case'export-yolo':downloadSampleYOLO();toast('已导出模拟 YOLO 标签');break;
 case'approve-sample':{let ds=dataset(ui.chosenDataset),sample=ds?.samples.find(s=>s.id===ui.chosenSample);if(!sample)return;sample.reviewed=true;audit('人工复核标注',`${ds.id} / ${sample.id}`,'engineer01');save();render();toast('标注结果已复核');break}
 case'finish-train':finishTraining(id);break;
 case'run-simulation':{let a=artifact(ui.selectedModel)||state.artifacts.find(x=>x.type==='RKNN');if(!a)return toast('请先转换 RKNN 模型','error');a.tested=true;let r={id:uid('SIM-'),artifactId:a.id,before:state.artifacts.find(x=>x.id===a.sourceId)?.accuracy||94,after:a.accuracy,miss:2,false:1,status:'通过',created:now()};state.reports.unshift(r);audit('模型仿真测试',a.id);save();render();toast('仿真测试演示完成，报告已生成');break}
 case'publish-artifact':{let a=artifact(id);if(!a?.tested)return toast('请先对 RKNN 制品执行仿真测试','error');a.published=true;audit('模型制品发布',`${a.id} → 中心仓库`,'engineer01');save();render();toast('制品已发布，中心仓库可查看');break}
 case'go-warehouse':navigate('center','warehouse');break;
 case'go-device-config':ui.selectedDevice=id;ui.selectedChannel=dev(id).channels[0]?.id;ui.drawer=null;navigate('center','channels');break;
 case'go-channel-device':ui.drawer={type:'device',id:x.dataset.device};render();break;
 case'select-channel':ui.selectedDevice=x.dataset.device;ui.selectedChannel=x.dataset.channel;render();document.getElementById('channel-editor')?.scrollIntoView({block:'start',behavior:'smooth'});break;
 case'apply-device-filter':ui.deviceQuery=document.getElementById('deviceSearch')?.value?.trim()||'';render();break;
 case'clear-device-filter':ui.deviceQuery='';ui.deviceStatus='全部';render();break;
 case'apply-channel-filter':ui.channelQuery=document.getElementById('channelSearch')?.value?.trim()||'';render();break;
 case'clear-channel-filter':ui.channelQuery='';ui.channelDevice='全部';ui.channelStatus='全部';render();break;
 case'wall-back':navigate('center','workbench');break;
 case'wall-open-channel':ui.selectedDevice=x.dataset.device;ui.selectedChannel=x.dataset.channel;navigate('center','channels');break;
 case'wall-open-alarm':navigate('center','alarms');ui.drawer={type:'alarm',id:x.dataset.id};render();break;
 case'wall-refresh':render();toast('演示态势已刷新');break;
 case'toggle-wall-fullscreen':if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else document.exitFullscreen?.();break;
 case'toggle-online':switchOnline(id);break;
 case'simulate-alarm':addAlarm(id);break;
 case'flush-queue':{let n=flushQueue(ui.selectedDevice);render();toast(n?`已补报 ${n} 条告警`:'当前没有待补报的告警');break}
 case'handle-alarm':{let a=state.alarms.find(x=>x.id===id);if(a){a.status='已处理';audit('告警处置标记',id);save()}ui.drawer=null;render();toast('告警已标记为已处理');break}
 case'apply-alarm-filter':ui.alarmQuery=document.getElementById('alarmSearch')?.value?.trim()||'';ui.alarmFrom=document.querySelector('[name=alarmFrom]')?.value||'';ui.alarmTo=document.querySelector('[name=alarmTo]')?.value||'';render();break;
 case'clear-alarm-filter':ui.alarmQuery='';ui.alarmStatus='全部';ui.alarmType='全部';ui.alarmDevice='全部';ui.alarmFrom='';ui.alarmTo='';render();break;
 case'export-alarms':exportCsv();break;
 case'toggle-user':{let u=state.users.find(x=>x.id===id);if(u){u.enabled=!u.enabled;audit('账号状态调整',`${u.name} → ${u.enabled?'启用':'停用'}`);save();render()}break}
 case'capture':toast('已生成模拟抓拍，未访问真实摄像头');break;
 case'fetch-logs':{let d=dev(id);state.logs.unshift({time:now(),dev:id,msg:'模拟中心下发日志获取指令',type:'info'});audit('获取设备日志',id);save();render();toast(`${d?.name||id}：已获取模拟日志`);break}
 case'reboot-device':{let d=dev(id);if(!d?.online)return toast('设备离线，无法远程重启','error');state.logs.unshift({time:now(),dev:id,msg:'收到中心远程重启指令；已完成模拟重启',type:'info'});audit('远程设备重启',id);save();render();toast('远程重启已模拟完成');break}
 case'update-roi':{let d=activeDevice(),c=d.channels.find(t=>t.id===ui.selectedChannel)||d.channels[0];let r=x.getBoundingClientRect(),xx=Math.round((e.clientX-r.left)/r.width*100),yy=Math.round((e.clientY-r.top)/r.height*100);c.roi.x=Math.min(65,Math.max(0,xx-20));c.roi.y=Math.min(65,Math.max(0,yy-18));c.roi.w=35;c.roi.h=34;save();render();break}
 case'push-config':{let form=document.querySelector('.config-form');if(!form)break;let get=n=>form.querySelector(`[name="${n}"]`)?.value;let d=dev(get('configDevice'));let c=d?.channels.find(t=>t.id===get('configChannel'));if(!c)return toast('请选择有效的视频通道','error');if(!d.online)return toast('设备离线，当前不能即时下发配置','error');let cf=Number(get('configConfidence')),iou=Number(get('configIOU')),db=Number(get('configDebounce'));if(![cf,iou].every(v=>v>=0&&v<=1)||db<0)return toast('置信度、IOU 取值应为 0–1，防抖时间不得为负数','error');if(!get('configName')?.trim())return toast('请输入通道名称','error');
 c.name=get('configName').trim();c.protocol=get('configProtocol');c.codec=get('configCodec');c.url=get('configUrl');c.modelId=get('configModel')||null;c.confidence=cf;c.iou=iou;c.debounce=db;c.schedule=get('configSchedule');if(c.modelId&&!d.downloadedModels.includes(c.modelId))d.downloadedModels.push(c.modelId);
 state.deliveries.unshift({id:uid('CF-'),time:now(),deviceId:d.id,channelId:c.id,modelId:c.modelId,status:'成功',user:'admin'});state.deliveries=state.deliveries.slice(0,80);state.logs.unshift({time:now(),dev:d.id,msg:`通道 ${c.name}(${c.id}) 的参数已保存并下发`,type:'info'});audit('通道参数下发',`${d.id}/${c.id}`);save();render();toast('当前通道配置已下发，列表与记录已更新');break}
 case'parse-agent':{let prompt=document.getElementById('agentPrompt')?.value?.trim();if(!prompt)return toast('请描述业务场景','error');ui.agentText=prompt;let smoke=/烟|火|燃烧/.test(prompt);let vehicle=/车|车牌|车辆/.test(prompt);ui.agentPlan={target:smoke?'烟火风险检测':vehicle?'车辆目标检测':'人员安全检测',classes:smoke?['烟雾','明火']:vehicle?['车辆']:['人员','安全帽'],title:prompt};ui.agentStep=0;render();toast('已生成模拟模型生产方案');break}
 case'smoke-agent':ui.agentText='请创建一个烟雾和明火风险检测模型，监控配电室，部署到 RK3588 边缘盒子，采用 INT8 量化。';render();break;
 case'execute-agent':executeAgent();break;
 default:break}}
function executeAgent(){if(!ui.agentPlan)return;if(ui.agentStep>=6)return;const p=ui.agentPlan;let id=uid('DS-'),ds={id,name:p.target+'数据集',classes:p.classes,samples:[{id:uid('IMG-'),name:'智能任务示例样本.jpg',src:p.classes.includes('烟雾')?CAM[3]:CAM[0],boxes:[{id:uid('B-'),label:p.classes[0],x:20,y:20,w:28,h:50}],reviewed:true}],created:now(),version:'V1.0'};state.datasets.unshift(ds);ui.agentStep=1;render();const t={id:uid('TR-'),name:p.target+' · 自动训练',datasetId:id,framework:'YOLO',epochs:100,batch:16,lr:.001,status:'已完成',progress:100,accuracy:93.2,loss:.09,created:now()};const a={id:uid('PT-'),name:p.target+' YOLO',version:'V1.0.0',type:'PT',taskId:t.id,datasetId:id,accuracy:93.2,created:now(),published:false};const rk={id:uid('RK-'),name:p.target+' YOLO',version:'V1.0.0',type:'RKNN',sourceId:a.id,taskId:t.id,datasetId:id,accuracy:92.3,device:'RK3588',quant:'INT8',tested:true,published:true,created:now()};let steps=[()=>{state.training.unshift(t)},()=>{state.artifacts.push(a)},()=>{state.artifacts.push(rk)},()=>{state.reports.unshift({id:uid('SIM-'),artifactId:rk.id,before:93.2,after:92.3,miss:2,false:1,status:'通过',created:now()})},()=>{rk.published=true;audit('AI建模助手模拟',`${p.target} 全链路产出 ${rk.id}`,'engineer01')}];let i=0;const timer=setInterval(()=>{steps[i]?.();i++;ui.agentStep=i+1;save();if(ui.sys==='production'&&ui.page==='agent')render();if(i>=steps.length){clearInterval(timer);toast('模拟生产任务已完成，制品已发布入库管理平台')}},480)}
function handleChange(e){const n=e.target.name,v=e.target.value;if(n==='deviceSelect'){ui.selectedDevice=v;ui.selectedChannel=dev(v)?.channels[0]?.id;render()}else if(n==='configDevice'){ui.selectedDevice=v;ui.selectedChannel=dev(v)?.channels[0]?.id;render()}else if(n==='configChannel'){ui.selectedChannel=v;render()}else if(n==='annoDataset'){ui.chosenDataset=v;ui.chosenSample=dataset(v)?.samples[0]?.id||'';render()}else if(n==='annoClass'){ui.annoClass=v}else if(n==='simArtifact'){ui.selectedModel=v;render()}else if(n==='alarmStatus'){ui.alarmStatus=v;render()}else if(n==='alarmType'){ui.alarmType=v;render()}else if(n==='alarmDevice'){ui.alarmDevice=v;render()}else if(n==='deviceStatus'){ui.deviceStatus=v;render()}else if(n==='channelDevice'){ui.channelDevice=v;render()}else if(n==='channelStatus'){ui.channelStatus=v;render()}else if(e.target.type==='file'&&e.target.dataset.dsid){const did=e.target.dataset.dsid;const ds=dataset(did);Array.from(e.target.files||[]).slice(0,8).forEach(file=>{const reader=new FileReader();reader.onload=()=>{let src=file.type.startsWith('image/')?String(reader.result):CAM[0];ds.samples.push({id:uid('IMG-'),name:file.name+(file.type.startsWith('video/')?'（解帧示意）':''),src,boxes:[],reviewed:false});audit('样本上传',`${ds.id} · ${file.name}`);save();render()};if(file.type.startsWith('image/'))reader.readAsDataURL(file);else reader.onload()});toast('样本已添加至数据集（视频上传为解帧示意）')}}
document.addEventListener('click',handleClick);
document.addEventListener('change',handleChange);
document.addEventListener('submit',e=>{if(e.target.id==='modal-form'){e.preventDefault();doModalSubmit()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(ui.modal||ui.drawer)){ui.modal=null;ui.drawer=null;render()}if(e.key==='Enter'&&e.target.id==='alarmSearch'){e.preventDefault();ui.alarmQuery=e.target.value;render()}});
render();
setInterval(()=>{if(ui.sys==='center'&&ui.page==='wall'){let el=document.querySelector('.wall-header-right time');if(el)el.textContent=now()}},1000);
})();
